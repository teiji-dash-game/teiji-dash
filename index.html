<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="定時までに表を仕上げろ。Excelの操作感で遊べる無料ブラウザゲーム。ショートカットが遊びながら身につく。">
<meta property="og:title" content="定時ダッシュ">
<meta property="og:description" content="Excelの操作感で遊べる無料ブラウザゲーム。クリアタイムで腕試し。">
<meta property="og:image" content="https://teiji-dash-game.github.io/teiji-dash/icon.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.png">
<title>定時ダッシュ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 全画面3Dオフィス → PC画面（表計算）。夜のオフィス×ポップなHUD。暗い世界観で固定 */
:root{
  --bg:#0E1220; --panel:#171D30; --ink:#F2F4FA; --muted:#98A2BC; --line:#2A3350;
  --sheet:#FFFFFF; --sheet-ink:#1C2333; --grid:#E1E5EC; --head:#F1F3F6; --xl:#1E9E5A;
  --yellow:#FFD23F; --pink:#FF5F93; --red:#FF4D5E; --blue:#5B8CFF;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{font:700 15px var(--f-body);border:2px solid #0B0E18;background:var(--ink);color:#0B0E18;border-radius:12px;padding:9px 18px;cursor:pointer;box-shadow:0 4px 0 #0B0E18;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0B0E18}
.btn.y{background:var(--yellow)} .btn.p{background:var(--pink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none;font-size:13px;padding:6px 12px}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.kbd{display:inline-block;font:700 12px var(--f-mono);background:var(--ink);color:#0B0E18;border-radius:6px;padding:1px 7px;box-shadow:0 2px 0 var(--muted);margin:0 2px;vertical-align:1px}

/* title */
.title{text-align:center;max-width:620px;width:100%;background:rgba(14,18,32,.72);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:24px;padding:28px 24px}
.title .q{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1.2;margin:0 0 6px;text-wrap:balance}
.title .q .m{color:var(--blue)} .title .q .b{color:var(--pink)}
.title .sub{color:var(--muted);margin:0 0 18px}
.title .tag{display:inline-block;font-family:var(--f-display);font-weight:800;background:var(--yellow);color:#0B0E18;border-radius:99px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.title .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.title input{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 12px;min-width:0;flex:0 1 220px}
.title .note{font-size:12px;color:var(--muted);margin-top:12px}

/* story bubble */
.story{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(640px,calc(100% - 32px))}
.bubble{background:#fff;color:#151A28;border-radius:20px;padding:16px 20px 14px;font-weight:700;font-size:18px;box-shadow:0 6px 0 rgba(0,0,0,.35);position:relative;animation:pop .25s ease-out}
.bubble .who{position:absolute;top:-13px;left:18px;background:var(--pink);color:#fff;font-size:12px;border-radius:99px;padding:1px 12px}
.bubble.nar{background:rgba(14,18,32,.85);color:var(--ink);border:1px solid var(--line);text-align:center}
.bubble.nar .who{display:none}
.bubble:not(.nar) .btn.ghost{color:#151A28;border-color:#C9CEDA}
#resL{background:rgba(8,10,20,.7);z-index:30}
.next{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.big-cap{position:fixed;top:22%;left:0;right:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,64px);color:var(--red);text-shadow:0 4px 0 #fff, 0 0 30px rgba(255,77,94,.6);transform:rotate(-4deg);animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.big-cap{animation-name:popr}
@keyframes popr{from{transform:rotate(-4deg) scale(.7);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
.flash.on{opacity:1}

/* game */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#1B2440,var(--bg));padding:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:10px}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hud .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em}
.clock{font:700 34px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.clock.hot{color:var(--red)}
.pill{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:2px 12px;margin-top:4px}
.sc{text-align:right}
.sc b{font:700 30px/1 var(--f-mono);color:var(--yellow)} .sc span{color:var(--muted);font-family:var(--f-mono)}
.mission{text-align:center;flex:1 1 300px;min-width:0}
.mission .mn{font-family:var(--f-display);font-weight:800;color:var(--yellow);font-size:13px}
.mission h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);margin:0;line-height:1.2}
.mission .goal{margin:4px 0 2px;font-weight:500}
.mission .keys{display:flex;gap:6px 14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mission.clear h2{animation:pop .3s}
.book{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--sheet);color:var(--sheet-ink);border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:none;position:relative}
.book .bar{background:var(--xl);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;display:flex;justify-content:space-between}
.book .fx{display:flex;border-bottom:1px solid var(--grid);font-family:var(--f-mono);font-size:13px}
.book .fx b{width:70px;text-align:center;border-right:1px solid var(--grid);padding:4px 0;background:var(--head)}
.book .fx span{padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .fx i{color:#8A93A6;padding:4px 0 4px 10px}
.gwrap{flex:1;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:820px}
th,td{color:var(--sheet-ink);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);height:27px;padding:0 8px;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--head);color:#5E6676;font:500 11px var(--f-mono);z-index:2;text-align:center}
td.rn{position:sticky;left:0;background:var(--head);color:#5E6676;font:500 11px var(--f-mono);text-align:center;width:36px;padding:0;z-index:1}
thead th.rn{z-index:3}
td.c{min-width:96px}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.in{background:#E7F5EC}
td.cur{box-shadow:inset 0 0 0 2px var(--xl)}
td.bold{font-weight:800}
td.err{color:#D32F45}
th.hl,td.rn.hl{background:#D3EEDD;color:#13723F}
td.c input{width:100%;font:inherit;border:0;outline:none;background:transparent;color:inherit;padding:0}
.tabs{background:var(--head);border-top:1px solid var(--grid);font-size:12px;padding:3px 10px;display:flex;gap:6px}
.tabs span{background:#fff;border:1px solid var(--grid);border-top:0;padding:1px 12px;color:var(--xl);font-weight:700}
.toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:800;font-family:var(--f-display);font-size:20px;border-radius:14px;padding:10px 20px;pointer-events:none;animation:pop .2s;z-index:20;text-align:center}
.toast.ok{background:var(--xl)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* result */
.res{background:var(--panel);border:1px solid var(--line);border-radius:24px;max-width:640px;width:100%;padding:24px;max-height:100%;overflow:auto}
.res h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,38px);margin:0;line-height:1.2;text-wrap:balance}
.res .lead{color:var(--muted);margin:4px 0 16px}
.rk{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.rk .r{font:800 44px/1 var(--f-display);width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:var(--yellow);color:#0B0E18}
.rk .r.S{background:var(--pink);color:#fff}
.rk .pts{font:800 54px/1 var(--f-display)} .rk .pts small{font-size:18px;color:var(--muted)}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.st div{background:var(--bg);border-radius:12px;padding:8px 12px} .st span{display:block;font-size:11px;color:var(--muted)} .st b{font:700 18px var(--f-mono)}
.kl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px;font-size:12px;margin:0 0 16px;padding:0;list-style:none}
.kl li{color:var(--muted)} .kl li.u{color:var(--ink)} .kl li::before{content:"・";} .kl li.u::before{content:"✓ ";color:var(--xl)}
.res .row{display:flex;gap:8px;flex-wrap:wrap}
.copied{font-size:12px;color:var(--xl);align-self:center}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.modes .btn{display:grid;text-align:center;line-height:1.3;padding:10px 18px}
.modes .btn small{font-weight:500;font-size:11px;opacity:.8}
.ribbon{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;background:var(--head);border-bottom:1px solid var(--grid)}
.ribbon button{font:500 12px var(--f-body);border:1px solid var(--grid);background:#fff;color:var(--sheet-ink);border-radius:6px;padding:3px 10px;cursor:pointer}
.ribbon button:hover{background:#E7F5EC;border-color:var(--xl)}
.book.mouse{cursor:default}.book.mouse td.c{cursor:cell}.book.mouse thead th,.book.mouse td.rn{cursor:pointer}
.pill.ok{background:var(--xl)}
.hintbtn{margin-top:6px;font-size:12px;padding:3px 12px}
.kb{margin:8px auto 0;display:grid;gap:3px;width:max-content;max-width:100%;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.kb .kr{display:flex;gap:3px}
.kb .k{min-width:26px;height:24px;padding:0 4px;border-radius:5px;background:#2A3350;color:var(--muted);font:600 10px var(--f-mono);display:grid;place-items:center;white-space:nowrap}
.kb .k.on{background:var(--yellow);color:#0B0E18;box-shadow:0 0 0 2px #fff;animation:pulse 1s infinite alternate}
.kb .gap{width:14px}
.kb .note{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
@keyframes pulse{to{transform:translateY(-2px)}}
.ribbon button.on{background:var(--yellow);border-color:#0B0E18;animation:pulse .6s infinite alternate}
td.ref{background:rgba(91,140,255,.18);box-shadow:inset 0 0 0 1px var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.st{grid-template-columns:repeat(2,minmax(0,1fr))}.clock{font-size:26px}.sc b{font-size:24px}}
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<div class="layer" id="titleL">
  <div class="title">
    <span class="tag">定時ダッシュ｜Excelの操作感で遊ぶ表計算ゲーム</span>
    <h1 class="q">もしも<span class="m">マウス</span>が<br><span class="b">電池切れ</span>したら？</h1>
    <p class="sub">会議まで10分で売上表を仕上げるミッション。入門編はマウスOKで基礎の8問、チャレンジはキーボードだけの10問。</p>
    <div class="row">
      <input id="name" placeholder="ニックネーム" maxlength="12" autocomplete="off">
    </div>
    <div class="modes">
      <button class="btn y" id="mBasic">入門編<small>マウスOK・基礎8問（Enter）</small></button>
      <button class="btn p" id="mNM">チャレンジ：マウス禁止<small>キーボードだけ・10問</small></button>
    </div>
    <p class="note"><button class="btn ghost snd">音：ON</button></p><p class="note" id="pcnote">PC＋キーボードでプレイしてください。入力は半角モード推奨。</p>
  </div>
</div>

<div id="storyL" hidden>
  <div class="big-cap" id="cap" hidden></div>
  <div class="story"><div class="bubble" id="bubble"><span class="who" id="who"></span><span id="line"></span>
    <div class="next"><span><span class="kbd">Space</span> / <span class="kbd">Enter</span> で次へ</span><button class="btn ghost" id="skipStory">ストーリーを飛ばす</button></div></div></div>
</div>
<div class="flash" id="flash"></div>

<div id="game" hidden>
  <div class="hud">
    <div><div class="lbl">会議まで</div><div class="clock" id="clock">10:00</div><span class="pill" id="pill">マウス：電池切れ</span></div>
    <div class="mission" id="mission"></div>
    <div class="sc"><button class="btn ghost snd" style="margin-bottom:6px">音：ON</button><div class="lbl">使ったショートカット</div><b id="kc">0</b> <span>/ 21</span></div>
  </div>
  <div class="book" id="book">
    <div class="bar"><span>会議資料_11月売上.xlsx</span><span id="barR">マウスは使えません</span></div>
    <div class="ribbon" id="ribbon" hidden><button data-act="bold"><b>B</b> 太字</button><button data-act="sum">Σ 合計</button><button data-act="copy">コピー</button><button data-act="paste">貼り付け</button><button data-act="undo">↶ 元に戻す</button><button data-act="save">保存</button></div>
    <div class="fx"><b id="addr">A1</b><i>fx</i><span id="fval"></span></div>
    <div class="gwrap" id="gwrap"><table id="grid"></table></div>
    <div class="tabs"><span>売上</span></div>
  </div>
  <div class="foot"><span>Windowsのキー配置が基本です。Macは Ctrl をそのまま使えます（Ctrl+Space は入力切替と被る場合あり）。</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="homeM">ホームへ戻る</button><button class="btn ghost" id="skipM">このミッションを飛ばす</button></span></div>
</div>

<div class="layer" id="resL" hidden><div class="res" id="res"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
let player='ゲスト';

/* ================= 3D OFFICE ================= */
let PL=null, R=null, scene, cam, camFrom, camTo, lookFrom, lookTo, camT=1, camDur=1, sceneOn=true, lastT=0;
const T=window.THREE;
function rnd(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;return t}
function face(skin,hair,opt={}){return canvasTex(16,16,(g)=>{g.fillStyle=skin;g.fillRect(0,0,16,16);g.fillStyle=hair;g.fillRect(0,0,16,opt.long?5:4);if(opt.long){g.fillRect(0,0,2,14);g.fillRect(14,0,2,14)}
  g.fillStyle='#1B1B1B';g.fillRect(4,7,2,2);g.fillRect(10,7,2,2);
  if(opt.glasses){g.strokeStyle='#1B1B1B';g.lineWidth=1;g.strokeRect(3.5,6.5,3,3);g.strokeRect(9.5,6.5,3,3);g.fillRect(6,7,4,1)}
  g.fillStyle=opt.mouth||'#B0273A';g.fillRect(6,11,4,opt.open?2:1)})}
function back(hair){return canvasTex(8,8,(g)=>{g.fillStyle=hair;g.fillRect(0,0,8,8)})}
function M(c,o={}){return new T.MeshLambertMaterial(Object.assign({color:c},o))}
function box(w,h,d,m,x,y,z,p){const b=new T.Mesh(new T.BoxGeometry(w,h,d),m);b.position.set(x,y,z);(p||scene).add(b);return b}
function person(o){
  const g=new T.Group(); const sk=M(o.skin||'#F1C9A5');
  box(.22,.8,.26,M(o.pants||'#2B3142'),-.13,.4,0,g); box(.22,.8,.26,M(o.pants||'#2B3142'),.13,.4,0,g);
  box(.56,.8,.32,M(o.body),0,1.2,0,g);
  if(o.tie) box(.08,.5,.02,M('#C8202F'),0,1.3,.17,g);
  box(.16,.74,.24,M(o.body),-.37,1.22,0,g); box(.16,.74,.24,M(o.body),.37,1.22,0,g);
  box(.15,.12,.2,sk,-.37,.8,0,g); box(.15,.12,.2,sk,.37,.8,0,g);
  const hm=[sk,sk,M(o.hair),sk,new T.MeshLambertMaterial({map:o.face}),new T.MeshLambertMaterial({map:back(o.hair)})];
  hm[0]=hm[1]=new T.MeshLambertMaterial({map:canvasTex(8,8,(g2)=>{g2.fillStyle=o.skin||'#F1C9A5';g2.fillRect(0,0,8,8);g2.fillStyle=o.hair;g2.fillRect(0,0,8,o.long?7:2)})});
  const head=new T.Mesh(new T.BoxGeometry(.6,.6,.6),hm); head.position.set(0,1.92,0); g.add(head);
  g.position.set(o.x,0,o.z); g.rotation.y=o.ry||0; scene.add(g); return g;
}
function buildScene(){
  const cv=$('scene'); R=new T.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2));
  scene=new T.Scene(); scene.background=new T.Color('#1A1F3A'); scene.fog=new T.Fog('#1A1F3A',12,26);
  cam=new T.PerspectiveCamera(50,1,.05,60);
  scene.add(new T.HemisphereLight('#C9D4FF','#3A3550',.85)); const dl=new T.DirectionalLight('#FFF2DD',.75); dl.position.set(3,8,6); scene.add(dl);
  const pl=new T.PointLight('#FFE7B0',.6,10); pl.position.set(0,3.6,1.5); scene.add(pl);
  // floor / walls
  box(30,.1,30,M('#59617A'),0,-.05,0);
  for(let i=-7;i<=7;i++) box(.02,.002,30,M('#4E5670'),i*2,.002,0);
  const city=canvasTex(512,160,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#1A1D45');gr.addColorStop(.6,'#5A3C78');gr.addColorStop(1,'#E7728A');g.fillStyle=gr;g.fillRect(0,0,w,h);
    const r=rnd(7);let x=0;while(x<w){const bw=14+r()*30,bh=40+r()*100;g.fillStyle=r()>.5?'#151833':'#1F2246';g.fillRect(x,h-bh,bw,bh);g.fillStyle='#FFD98A';for(let yy=h-bh+4;yy<h-4;yy+=7)for(let xx=x+3;xx<x+bw-3;xx+=5)if(r()>.62)g.fillRect(xx,yy,2,3);x+=bw+2}});
  city.magFilter=T.LinearFilter;
  const win=new T.Mesh(new T.PlaneGeometry(22,6.6),new T.MeshBasicMaterial({map:city})); win.position.set(0,3.6,-6); scene.add(win);
  for(let i=-5;i<=5;i++) box(.12,6.6,.12,M('#2A2F48'),i*2.2,3.6,-5.95);
  box(22,.3,.3,M('#2A2F48'),0,.5,-5.9); box(22,.4,.4,M('#2A2F48'),0,6.9,-5.9);
  box(.2,7,30,M('#3C4360'),-11,3.5,0); box(.2,7,30,M('#3C4360'),11,3.5,0);

function ctrlD(){ snap(); const q=rect();
